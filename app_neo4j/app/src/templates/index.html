<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Tarefas</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
        }
        /* Estilo do menu lateral */
        .sidebar {
            width: 200px;
            background-color: #2c3e50;
            color: white;
            height: 100vh;
            position: fixed;
            padding-top: 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 12px;
            text-decoration: none;
            transition: background 0.3s;
        }

        .sidebar a:hover {
            background-color: #34495e;
        }

        /* Área principal */
        .content {
            margin-left: 220px;
            padding: 20px;
            flex-grow: 1;
        }

        .content h1 {
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <!-- Menu lateral -->
    <div class="sidebar">
        <h2>Menu</h2>
        <a href="/create">➕ Criar Tarefa</a>
        <a href="/get_task">📋 Ver Tarefas</a>
        <a href="/delete">🗑️ Deletar Tarefa</a>
        <a href="/edit">✏️ Editar Tarefa</a>
    </div>

    <!-- Conteúdo principal -->
    <div class="content">
        <h1>Bem-vindo ao Gerenciador de Tarefas</h1>
        <p>Selecione uma opção no menu lateral para começar.</p>
    </div>
</body>
</html>
