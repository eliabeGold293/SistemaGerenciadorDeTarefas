<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Deletar Tarefa</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            background-color: #f9f9f9;
        }

        /* Estilo do menu lateral */
        .sidebar {
            width: 200px;
            background-color: #2c3e50;
            color: white;
            height: 100vh;
            position: fixed;
            padding-top: 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 12px;
            text-decoration: none;
            transition: background 0.3s;
        }

        .sidebar a:hover {
            background-color: #34495e;
        }

        /* Área principal */
        .content {
            margin-left: 220px;
            padding: 20px;
            flex-grow: 1;
        }

        .content h1 {
            color: #2c3e50;
        }
        form {
            margin-top: 20px;
            background: #fff;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 500px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            text-align: left;
        }

        input[type="text"], button {
            width: 100%;               /* todos os elementos ocupam a mesma largura */
            box-sizing: border-box;    /* inclui padding/borda no cálculo da largura */
        }

        input[type="text"] {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 15px;
        }

        button:hover {
            background-color: #c0392b;
        }


        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        /* Rodapé fixo e alinhado */
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px;
            margin-left: 200px; /* alinhado com a sidebar */
            position: fixed;
            bottom: 0;
            width: calc(100% - 200px); /* ocupa toda a largura menos a sidebar */
        }

    </style>
    <script>
        async function deletarTarefa(event) {
            event.preventDefault();
            const title = document.getElementById("title").value;

            if (!title) {
                document.getElementById("message").innerText = "Digite o título da tarefa!";
                return;
            }

            try {
                const response = await fetch("/delete_task_by_name", {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title })
                });

                const data = await response.json();
                document.getElementById("message").innerText = data.message;
                document.getElementById("message").style.color = 
                    data.status === "success" ? "green" : "red";

            } catch (error) {
                document.getElementById("message").innerText = "Erro ao conectar com a API.";
                document.getElementById("message").style.color = "red";
            }
        }
    </script>
</head>
<body>
    <!-- Menu lateral -->
    <div class="sidebar">
        <h2>Menu</h2>
        <a href="/create">➕ Criar Tarefa</a>
        <a href="/get_task">📋 Ver Tarefas</a>
        <a href="/delete">🗑️ Deletar Tarefa</a>
        <a href="/edit">✏️ Editar Tarefa</a>
    </div>

    <!-- Conteúdo principal -->
    <div class="content">
        <h1>Deletar Tarefa</h1>
        <form onsubmit="deletarTarefa(event)">
            <label for="title">Título da tarefa:</label>
            <input type="text" id="title" name="title" placeholder="Digite o título da tarefa">
            <button type="submit">🗑️ Deletar</button>
        </form>
        <div id="message" class="message"></div>
    </div>

    <!-- Rodapé -->
    <footer>
        <p>© 2025 - Gerenciador de Tarefas | Desenvolvido por Eliabe</p>
    </footer>
</body>
</html>
