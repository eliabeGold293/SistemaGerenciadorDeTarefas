<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Criar Tarefa</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Área principal */
        .content {
            flex: 1;
            padding: 20px;
            margin-left: 220px; /* alinhamento com menu lateral */
        }

        h1 {
            color: #2c3e50;
        }

        form {
            margin-top: 20px;
            background: #fff;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 500px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            text-align: left; /* mantém alinhamento do texto */
        }

        input, textarea, select, button {
            width: 100%;            /* todos ocupam a mesma largura */
            box-sizing: border-box; /* inclui padding/borda no cálculo da largura */
        }

        input, textarea, select {
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            margin-top: 15px;
            padding: 12px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #34495e;
        }


        /* Estilo do menu lateral */
        .sidebar {
            width: 200px;
            background-color: #2c3e50;
            color: white;
            height: 100vh;
            position: fixed;
            padding-top: 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 12px;
            text-decoration: none;
            transition: background 0.3s;
        }

        .sidebar a:hover {
            background-color: #34495e;
        }

        /* Rodapé fixo e alinhado */
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px;
            margin-left: 200px; /* alinhado com a sidebar */
            position: fixed;
            bottom: 0;
            width: calc(100% - 200px); /* ocupa toda a largura menos a sidebar */
        }

    </style>
</head>
<body>
    <!-- Menu lateral -->
    <div class="sidebar">
        <h2>Menu</h2>
        <a href="/create">➕ Criar Tarefa</a>
        <a href="/get_task">📋 Ver Tarefas</a>
        <a href="/delete">🗑️ Deletar Tarefa</a>
        <a href="/edit">✏️ Editar Tarefa</a>
    </div>

    <!-- Conteúdo principal -->
    <div class="content">
        <h1>Criar Nova Tarefa</h1>
        <form action="/criar_tarefa/" method="POST" enctype="multipart/form-data">
            <label for="title">Título:</label>
            <input type="text" id="title" name="title" required>

            <label for="status">Status:</label>
            <select id="status" name="status">
                <option value="">-- Selecione --</option>
                <option value="pendente">Pendente</option>
                <option value="em andamento">Em andamento</option>
                <option value="concluída">Concluída</option>
            </select>

            <label for="description">Descrição:</label>
            <textarea id="description" name="description"></textarea>

            <label for="data_prev">Data Prevista:</label>
            <input type="date" id="data_prev" name="data_prev">

            <label for="arquive">Arquivo:</label>
            <input type="file" id="arquive" name="arquive">

            <button type="submit">Criar Tarefa</button>
        </form>
    </div>

    <!-- Rodapé -->
    <footer>
        <p>© 2025 - Gerenciador de Tarefas | Desenvolvido por Eliabe</p>
    </footer>
</body>
</html>
