<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Tarefa</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            background-color: #f9f9f9;
        }

        /* Estilo do menu lateral */
        .sidebar {
            width: 200px;
            background-color: #2c3e50;
            color: white;
            height: 100vh;
            position: fixed;
            padding-top: 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 12px;
            text-decoration: none;
            transition: background 0.3s;
        }

        .sidebar a:hover {
            background-color: #34495e;
        }

        /* Área principal */
        .content {
            margin-left: 220px;
            padding: 20px;
            flex-grow: 1;
        }

        .content h1 {
            color: #2c3e50;
        }

        form {
            margin-top: 20px;
            background: #fff;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 500px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            text-align: left; /* mantém alinhamento do texto */
        }

        input, textarea, select, button {
            width: 100%;            /* todos ocupam a mesma largura */
            box-sizing: border-box; /* inclui padding/borda no cálculo da largura */
        }

        input, textarea, select {
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            margin-top: 15px;
            padding: 12px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #34495e;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }
        /* Rodapé fixo e alinhado */
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px;
            margin-left: 200px; /* alinhado com a sidebar */
            position: fixed;
            bottom: 0;
            width: calc(100% - 200px); /* ocupa toda a largura menos a sidebar */
        }
    </style>
    <script>
        async function editarTarefa(event) {
            event.preventDefault();

            const taskId = document.getElementById("task_id").value;
            const formData = new FormData(document.getElementById("editForm"));

            if (!taskId) {
                document.getElementById("message").innerText = "Informe o ID da tarefa!";
                document.getElementById("message").style.color = "red";
                return;
            }

            try {
                const response = await fetch(`/edit_task/${taskId}`, {
                    method: "PUT",
                    body: formData
                });

                const data = await response.json();
                document.getElementById("message").innerText = data.message;
                document.getElementById("message").style.color = 
                    data.status === "success" ? "green" : "red";

            } catch (error) {
                document.getElementById("message").innerText = "Erro ao conectar com a API.";
                document.getElementById("message").style.color = "red";
            }
        }
    </script>
</head>
<body>
    <!-- Menu lateral -->
    <div class="sidebar">
        <h2>Menu</h2>
        <a href="/create">➕ Criar Tarefa</a>
        <a href="/get_task">📋 Ver Tarefas</a>
        <a href="/delete">🗑️ Deletar Tarefa</a>
        <a href="/edit">✏️ Editar Tarefa</a>
    </div>

    <!-- Conteúdo principal -->
    <div class="content">
        <h1>Editar Tarefa</h1>
        <form id="editForm" onsubmit="editarTarefa(event)">
            <label for="task_id">ID da tarefa:</label>
            <input type="text" id="task_id" name="task_id" placeholder="Digite o ID da tarefa">

            <label for="title">Título:</label>
            <input type="text" id="title" name="title" placeholder="Novo título">

            <label for="status">Status:</label>
            <select id="status" name="status">
                <option value="">-- Selecione --</option>
                <option value="pendente">Pendente</option>
                <option value="em andamento">Em andamento</option>
                <option value="concluída">Concluída</option>
            </select>

            <label for="description">Descrição:</label>
            <textarea id="description" name="description" placeholder="Nova descrição"></textarea>

            <label for="data_prev">Data prevista:</label>
            <input type="date" id="data_prev" name="data_prev">

            <label for="arquive">Novo arquivo:</label>
            <input type="file" id="arquive" name="arquive">

            <button type="submit">✏️ Atualizar</button>
        </form>
        <div id="message" class="message"></div>
    </div>

    <!-- Rodapé -->
    <footer>
        <p>© 2025 - Gerenciador de Tarefas | Desenvolvido por Eliabe</p>
    </footer>
</body>
</html>
