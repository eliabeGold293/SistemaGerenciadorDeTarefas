<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tarefas</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            background-color: #f9f9f9;
        }

        /* Estilo do menu lateral */
        .sidebar {
            width: 200px;
            background-color: #2c3e50;
            color: white;
            height: 100vh;
            position: fixed;
            padding-top: 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 12px;
            text-decoration: none;
            transition: background 0.3s;
        }

        .sidebar a:hover {
            background-color: #34495e;
        }

        /* Conteúdo principal */
        .content { 
            margin-left: 220px; 
            padding: 20px; 
        }

        h1 {
            color: #2c3e50;
        }

        /* Caixa de busca */
        .search-box { 
            margin-bottom: 15px; 
        }

        .search-box input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* Tabela */
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
            background: #fff;
        }

        th, td { 
            border: 1px solid #ddd; 
            padding: 8px; 
            text-align: left; 
        }

        th { 
            background-color: #2c3e50; 
            color: #fff;
        }

        tr:nth-child(even) { 
            background-color: #f2f2f2; 
        }

        tr:hover { 
            background-color: #e6f7ff; 
        }
        /* Rodapé fixo e alinhado */
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px;
            margin-left: 200px; /* alinhado com a sidebar */
            position: fixed;
            bottom: 0;
            width: calc(100% - 200px); /* ocupa toda a largura menos a sidebar */
        }
    </style>

    <script>
        // Função de filtro da tabela
        function filtrarTarefas() {
            let input = document.getElementById("searchInput");
            let filtro = input.value.toLowerCase();
            let linhas = document.querySelectorAll("#tabelaTarefas tbody tr");

            linhas.forEach(linha => {
                let texto = linha.textContent.toLowerCase();
                linha.style.display = texto.includes(filtro) ? "" : "none";
            });
        }

        // Função para carregar tarefas da API
        async function carregarTarefas() {
            try {
                const response = await fetch("/task_list/");
                const data = await response.json();
                const tasks = data.tasks || [];

                const tbody = document.querySelector("#tabelaTarefas tbody");
                tbody.innerHTML = ""; // limpa tabela

                tasks.forEach(task => {
                    const tr = document.createElement("tr");

                    tr.innerHTML = `
                        <td>${task.id}</td>
                        <td>${task.title}</td>
                        <td>${task.status}</td>
                        <td>${task.description}</td>
                        <td>${task.data_prev}</td>
                        <td>${task.created_at}</td>
                        <td>${task.arquive ? `<a href="/uploads/${task.arquive}" target="_blank">${task.arquive}</a>` : "-"}</td>
                    `;

                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Erro ao carregar tarefas:", error);
            }
        }

        // Carrega tarefas ao abrir a página
        window.onload = carregarTarefas;
    </script>
</head>
<body>
    <!-- Menu lateral -->
    <div class="sidebar">
        <h2>Menu</h2>
        <a href="/create">➕ Criar Tarefa</a>
        <a href="/get_task">📋 Ver Tarefas</a>
        <a href="/delete">🗑️ Deletar Tarefa</a>
        <a href="/edit">✏️ Editar Tarefa</a>
    </div>

    <!-- Conteúdo principal -->
    <div class="content">
        <h1>Lista de Tarefas</h1>

        <!-- Caixa de busca -->
        <div class="search-box">
            <input type="text" id="searchInput" onkeyup="filtrarTarefas()" placeholder="🔍 Buscar tarefa...">
        </div>

        <!-- Tabela de tarefas -->
        <table id="tabelaTarefas">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Status</th>
                    <th>Descrição</th>
                    <th>Data Prevista</th>
                    <th>Criada em</th>
                    <th>Arquivo</th>
                </tr>
            </thead>
            <tbody>
                <!-- preenchido dinamicamente via JS -->
            </tbody>
        </table>
    </div>

    <!-- Rodapé -->
    <footer>
        <p>© 2025 - Gerenciador de Tarefas | Desenvolvido por Eliabe</p>
    </footer>
</body>
</html>
